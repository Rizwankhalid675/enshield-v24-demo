    <!--
      Inter is self-hosted from /fonts (BUG FB). It used to be fetched from
      fonts.googleapis.com, which coupled first paint to a third-party CDN,
      broke air-gapped/self-hosted installs, and disclosed every visitor's IP
      to Google. `font-display: swap` in inter.css still renders text
      immediately in the system fallback declared in --font-sans.

      The latin subset is preloaded because it is on the critical path for
      essentially every dashboard view; the other six subsets stay lazy behind
      their unicode-range. Do not add external font origins here —
      scripts/check-no-external-origins.mjs fails the build if you do.
    -->
    <link
      rel="preload"
      href="./fonts/inter-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="./fonts/inter.css" />
